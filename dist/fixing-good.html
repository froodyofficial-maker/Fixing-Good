<script>

/* ===== js/core.js ===== */
'use strict';
// ============================================================
//  FIXING GOOD - core: canvas, math, input, audio, save
// ============================================================
const W = 1280, H = 720, GROUND = 610;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let DPR = 1, VIEW_SCALE = 1;

function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  VIEW_SCALE = s;
  canvas.style.width = Math.floor(W * s) + 'px';
  canvas.style.height = Math.floor(H * s) + 'px';
  DPR = Math.min(2, (window.devicePixelRatio || 1) * s);
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
}
addEventListener('resize', resize);
resize();

// ---------- math ----------
const PI = Math.PI, TAU = PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const choose = arr => arr[Math.floor(Math.random() * arr.length)];
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const sign = v => v < 0 ? -1 : 1;
const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOut = t => 1 - (1 - t) * (1 - t);
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > PI) d -= TAU; if (d < -PI) d += TAU; return d; };
const fmtMoney = n => '$' + Math.round(n).toLocaleString('en-US');

function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

// seeded rng for repeatable scenery
function srand(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) % 100000) / 100000; }; }

// segment vs rect (returns t of entry or -1)
function segRect(x1, y1, x2, y2, r) {
  let t0 = 0, t1 = 1; const dx = x2 - x1, dy = y2 - y1;
  const p = [-dx, dx, -dy, dy], q = [x1 - r.x, r.x + r.w - x1, y1 - r.y, r.y + r.h - y1];
  for (let i = 0; i < 4; i++) {
    if (p[i] === 0) { if (q[i] < 0) return -1; }
    else { const t = q[i] / p[i]; if (p[i] < 0) { if (t > t1) return -1; if (t > t0) t0 = t; } else { if (t < t0) return -1; if (t < t1) t1 = t; } }
  }
  return t0;
}
// segment vs circle -> t or -1
function segCircle(x1, y1, x2, y2, cx, cy, r) {
  const dx = x2 - x1, dy = y2 - y1, fx = x1 - cx, fy = y1 - cy;
  const a = dx * dx + dy * dy, b = 2 * (fx * dx + fy * dy), c = fx * fx + fy * fy - r * r;
  if (c < 0) return 0;
  let disc = b * b - 4 * a * c; if (disc < 0 || a === 0) return -1;
  disc = Math.sqrt(disc); const t = (-b - disc) / (2 * a);
  return t >= 0 && t <= 1 ? t : -1;
}
// segment vs capsule
function segCapsule(x1, y1, x2, y2, ax, ay, bx, by, r) {
  let best = -1;
  for (let i = 0; i <= 4; i++) {
    const t = segCircle(x1, y1, x2, y2, lerp(ax, bx, i / 4), lerp(ay, by, i / 4), r);
    if (t >= 0 && (best < 0 || t < best)) best = t;
  }
  return best;
}

// ---------- input ----------
const Input = {
  keys: {}, pressed: {}, mx: W / 2, my: H / 2, mdown: false, mclick: false, rdown: false, rclick: false, wheel: 0, anyKey: false,
  down(k) { return !!this.keys[k]; },
  hit(k) { return !!this.pressed[k]; },
  endFrame() { this.pressed = {}; this.mclick = false; this.rclick = false; this.wheel = 0; this.anyKey = false; }
};
addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'Tab'].includes(e.code)) e.preventDefault();
  if (!Input.keys[e.code]) Input.pressed[e.code] = true;
  Input.keys[e.code] = true; Input.anyKey = true; Audio.unlock();
});
addEventListener('keyup', e => { Input.keys[e.code] = false; });
addEventListener('blur', () => { Input.keys = {}; Input.mdown = false; });
function mousePos(e) {
  const r = canvas.getBoundingClientRect();
  Input.mx = (e.clientX - r.left) / r.width * W;
  Input.my = (e.clientY - r.top) / r.height * H;
}
canvas.addEventListener('mousemove', mousePos);
canvas.addEventListener('mousedown', e => {
  mousePos(e); Audio.unlock();
  if (e.button === 0) { Input.mdown = true; Input.mclick = true; }
  if (e.button === 2) { Input.rdown = true; Input.rclick = true; }
  Input.anyKey = true;
});
addEventListener('mouseup', e => { if (e.button === 0) Input.mdown = false; if (e.button === 2) Input.rdown = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => { Input.wheel += Math.sign(e.deltaY); e.preventDefault(); }, { passive: false });

// ---------- settings + save ----------
const Settings = { volume: 0.8, music: 0.5, shake: 1, gore: 2 }; // gore: 0 off, 1 low, 2 full
function store(k, v) { try { localStorage.setItem('fixinggood.' + k, JSON.stringify(v)); } catch (e) { } }
function load(k) { try { const v = localStorage.getItem('fixinggood.' + k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
Object.assign(Settings, load('settings') || {});

// ---------- audio (all synthesized) ----------
const Audio = {
  ctx: null, master: null, sfxBus: null, musicBus: null, noiseBuf: null, musicOn: false, musicMood: null,
  unlock() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.connect(this.ctx.destination);
      const comp = this.ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 6;
      comp.connect(this.master);
      this.sfxBus = this.ctx.createGain(); this.sfxBus.connect(comp);
      this.musicBus = this.ctx.createGain(); this.musicBus.connect(this.master);
      const len = this.ctx.sampleRate * 2; this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.applyVolume();
      if (this.musicMood) this.music(this.musicMood, true);
    } catch (e) { this.ctx = null; }
  },
  applyVolume() { if (!this.ctx) return; this.sfxBus.gain.value = Settings.volume; this.musicBus.gain.value = Settings.music * 0.55; },
  noise(dur, freq, q, vol, type = 'lowpass', when = 0, decay = 1, pan = 0) {
    if (!this.ctx) return; const t = this.ctx.currentTime + when;
    const s = this.ctx.createBufferSource(); s.buffer = this.noiseBuf; s.playbackRate.value = rand(0.9, 1.1);
    const f = this.ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = this.ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur * decay);
    let out = g;
    if (this.ctx.createStereoPanner) { const p = this.ctx.createStereoPanner(); p.pan.value = clamp(pan, -1, 1); g.connect(p); out = p; }
    s.connect(f); f.connect(g); out.connect(this.sfxBus); s.start(t, rand(0, 1)); s.stop(t + dur + 0.05);
  },
  tone(freq, dur, vol, type = 'sine', when = 0, slide = 0, bus) {
    if (!this.ctx) return; const t = this.ctx.currentTime + when;
    const o = this.ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
    const g = this.ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(bus || this.sfxBus); o.start(t); o.stop(t + dur + 0.05);
  },
  play(name, pan = 0, vol = 1) {
    if (!this.ctx) return;
    const v = vol;
    switch (name) {
      case 'pistol': this.noise(0.25, 2400, 0.7, 0.9 * v, 'lowpass', 0, 1, pan); this.tone(150, 0.12, 0.5 * v, 'triangle', 0, 0.4); break;
      case 'revolver': this.noise(0.5, 1800, 0.8, 1.1 * v, 'lowpass', 0, 1, pan); this.tone(110, 0.25, 0.7 * v, 'triangle', 0, 0.35); break;
      case 'shotgun': this.noise(0.6, 1300, 0.6, 1.3 * v, 'lowpass', 0, 1, pan); this.tone(80, 0.3, 0.9 * v, 'sine', 0, 0.4); break;
      case 'smg': this.noise(0.14, 3000, 0.8, 0.6 * v, 'lowpass', 0, 1, pan); this.tone(180, 0.07, 0.35 * v, 'triangle', 0, 0.5); break;
      case 'rifle': this.noise(0.32, 2000, 0.9, 1.0 * v, 'lowpass', 0, 1, pan); this.tone(120, 0.14, 0.6 * v, 'triangle', 0, 0.4); break;
      case 'mg': this.noise(0.3, 1600, 0.9, 1.0 * v, 'lowpass', 0, 1, pan); this.tone(90, 0.12, 0.7 * v, 'square', 0, 0.4); break;
      case 'dry': this.tone(1800, 0.03, 0.2 * v, 'square'); break;
      case 'magout': this.tone(900, 0.04, 0.15 * v, 'square'); this.noise(0.05, 4000, 2, 0.2 * v, 'bandpass'); break;
      case 'magin': this.tone(700, 0.03, 0.25 * v, 'square'); this.tone(1100, 0.03, 0.2 * v, 'square', 0.04); this.noise(0.06, 3000, 3, 0.3 * v, 'bandpass'); break;
      case 'rack': this.noise(0.07, 2500, 4, 0.35 * v, 'bandpass'); this.noise(0.06, 3500, 4, 0.35 * v, 'bandpass', 0.09); this.tone(500, 0.04, 0.2 * v, 'square', 0.1); break;
      case 'shell': this.noise(0.05, 2200, 5, 0.3 * v, 'bandpass'); this.tone(600, 0.04, 0.15 * v, 'square', 0.02); break;
      case 'pump': this.noise(0.08, 1500, 3, 0.5 * v, 'bandpass'); this.noise(0.08, 1900, 3, 0.5 * v, 'bandpass', 0.13); break;
      case 'cylinder': this.tone(1300, 0.05, 0.2 * v, 'square'); this.noise(0.1, 5000, 3, 0.2 * v, 'bandpass'); break;
      case 'tink': this.tone(rand(2800, 3600), 0.08, 0.06 * v, 'sine'); break;
      case 'clank': this.tone(rand(300, 420), 0.12, 0.12 * v, 'square', 0, 0.6); this.noise(0.1, 1200, 2, 0.15 * v, 'bandpass'); break;
      case 'punch': this.noise(0.12, 600, 1, 0.9 * v, 'lowpass', 0, 1, pan); this.tone(90, 0.1, 0.6 * v, 'sine', 0, 0.5); break;
      case 'whoosh': this.noise(0.18, 900, 1, 0.25 * v, 'bandpass', 0, 1, pan); break;
      case 'hit': this.noise(0.12, 900, 1.5, 0.5 * v, 'bandpass', 0, 1, pan); this.tone(160, 0.06, 0.25 * v, 'sine'); break;
      case 'splat': this.noise(0.18, 500, 1.2, 0.5 * v, 'lowpass', 0, 1, pan); break;
      case 'headshot': this.noise(0.22, 700, 1.4, 0.8 * v, 'lowpass', 0, 1, pan); this.tone(70, 0.2, 0.5 * v, 'sine', 0, 0.5); break;
      case 'ric': this.tone(rand(1500, 2600), 0.2, 0.08 * v, 'sine', 0, 0.5); this.noise(0.05, 4000, 2, 0.15 * v, 'highpass'); break;
      case 'explode': this.noise(1.4, 700, 0.6, 1.6 * v, 'lowpass', 0, 1, pan); this.tone(55, 0.9, 1.0 * v, 'sine', 0, 0.3); this.noise(0.4, 3000, 0.5, 0.6 * v, 'lowpass'); break;
      case 'fire': this.noise(0.5, 400, 0.5, 0.15 * v, 'lowpass'); break;
      case 'hurt': this.noise(0.15, 700, 2, 0.4 * v, 'bandpass'); this.tone(220, 0.15, 0.2 * v, 'sawtooth', 0, 0.6); break;
      case 'ui': this.tone(660, 0.06, 0.15 * v, 'triangle'); break;
      case 'uiok': this.tone(660, 0.07, 0.15 * v, 'triangle'); this.tone(990, 0.1, 0.15 * v, 'triangle', 0.07); break;
      case 'cash': this.tone(1500, 0.06, 0.12 * v, 'square'); this.tone(2200, 0.12, 0.12 * v, 'square', 0.06); break;
      case 'bad': this.tone(200, 0.2, 0.2 * v, 'sawtooth', 0, 0.7); break;
      case 'type': this.tone(rand(380, 460), 0.025, 0.04 * v, 'square'); break;
      case 'bubble': this.tone(rand(300, 600), 0.08, 0.06 * v, 'sine', 0, 1.8); break;
      case 'engine': this.noise(0.4, 160, 1, 0.4 * v, 'lowpass'); this.tone(48, 0.4, 0.3 * v, 'sawtooth', 0, 1.1); break;
      case 'crash': this.noise(0.8, 1200, 0.7, 1.2 * v, 'lowpass'); this.tone(60, 0.5, 0.6 * v, 'square', 0, 0.4); break;
      case 'step': this.noise(0.04, 500, 1, 0.08 * v, 'lowpass', 0, 1, pan); break;
      case 'land': this.noise(0.08, 400, 1, 0.25 * v, 'lowpass', 0, 1, pan); break;
      case 'pickup': this.tone(880, 0.06, 0.12 * v, 'triangle'); this.tone(1320, 0.08, 0.12 * v, 'triangle', 0.05); break;
    }
  },
  // simple procedural score: drone + plucked desert guitar arpeggio
  music(mood, force) {
    this.musicMood = mood;
    if (!this.ctx) return;
    if (this._musicMoodPlaying === mood && !force) return;
    this._musicMoodPlaying = mood;
    if (!this._musicTimer) {
      this._musicStep = 0; this._next = this.ctx.currentTime + 0.1;
      this._musicTimer = setInterval(() => this._tick(), 60);
    }
  },
  _tick() {
    if (!this.ctx || !this.musicMood || this.musicMood === 'none') return;
    const moods = {
      menu: { bpm: 70, root: 110, scale: [0, 3, 5, 7, 10, 12], pat: [0, -1, 2, -1, 4, 3, -1, 1], drone: true, kick: false },
      hub: { bpm: 84, root: 98, scale: [0, 3, 5, 6, 7, 10, 12], pat: [0, 2, 4, 2, 5, 4, 2, -1], drone: true, kick: false },
      action: { bpm: 128, root: 82, scale: [0, 1, 3, 5, 7, 8, 10, 12], pat: [0, 0, 3, 0, 5, 0, 3, 6], drone: true, kick: true },
      tense: { bpm: 96, root: 73, scale: [0, 1, 4, 5, 7, 8], pat: [0, -1, -1, 1, -1, -1, 0, -1], drone: true, kick: false },
      cook: { bpm: 92, root: 130, scale: [0, 2, 4, 7, 9, 12], pat: [0, 3, 1, 4, 2, 5, 3, -1], drone: true, kick: false },
      boss: { bpm: 140, root: 73, scale: [0, 1, 3, 6, 7, 8, 11], pat: [0, 0, 6, 0, 5, 0, 3, 1], drone: true, kick: true },
    };
    const m = moods[this.musicMood]; if (!m) return;
    const stepDur = 60 / m.bpm / 2;
    while (this._next < this.ctx.currentTime + 0.25) {
      const s = this._musicStep++, t = this._next - this.ctx.currentTime;
      const idx = m.pat[s % m.pat.length];
      if (idx >= 0) {
        const semi = m.scale[idx % m.scale.length] + (s % 32 >= 16 && idx === 0 ? -2 : 0);
        const f = m.root * 2 * Math.pow(2, semi / 12);
        this.tone(f, stepDur * 3, 0.07, 'triangle', t, 0.995, this.musicBus);
        this.tone(f * 2, stepDur * 1.2, 0.02, 'sine', t, 1, this.musicBus);
      }
      if (m.drone && s % 16 === 0) { this.tone(m.root / 2, stepDur * 16, 0.06, 'sawtooth', t, 1, this.musicBus); this.tone(m.root * 0.75, stepDur * 16, 0.03, 'sine', t, 1, this.musicBus); }
      if (m.kick && s % 4 === 0) this.tone(70, 0.15, 0.25, 'sine', t, 0.4, this.musicBus);
      if (m.kick && s % 8 === 4) { const g = this.ctx.createGain(); g.gain.value = 0.12; g.connect(this.musicBus); const src = this.ctx.createBufferSource(); src.buffer = this.noiseBuf; const f = this.ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 2000; const g2 = this.ctx.createGain(); const tt = this.ctx.currentTime + t; g2.gain.setValueAtTime(0.5, tt); g2.gain.exponentialRampToValueAtTime(0.001, tt + 0.12); src.connect(f); f.connect(g2); g2.connect(g); src.start(tt); src.stop(tt + 0.15); }
      this._next += stepDur;
    }
  }
};

// loose magazine / casing art (used for dropped physics bits)
function drawMag(c, kind) {
  c.strokeStyle = INK; c.lineWidth = 1;
  if (kind === 'rifle') { c.fillStyle = '#3a2a1a'; c.beginPath(); c.moveTo(-3, -8); c.lineTo(3, -8); c.quadraticCurveTo(6, 0, 7, 8); c.lineTo(1, 9); c.quadraticCurveTo(0, 0, -3, -8); c.fill(); c.stroke(); }
  else if (kind === 'mg') { c.fillStyle = '#4a5030'; c.fillRect(-7, -6, 14, 12); c.strokeRect(-7, -6, 14, 12); }
  else if (kind === 'loader') { c.fillStyle = '#333'; c.beginPath(); c.arc(0, 0, 4.5, 0, TAU); c.fill(); }
  else { c.fillStyle = '#1a1a1a'; c.fillRect(-2.5, -6, 5, 12); c.strokeRect(-2.5, -6, 5, 12); c.fillStyle = '#c8a040'; c.fillRect(-1.5, -7, 3, 1.5); }
}

  c.beginPath(); c.ellipse(-40, -6, 8, 13, 0, 0, TAU); c.fill(); c.stroke();
  c.beginPath(); c.ellipse(40, -6, 8, 13, 0, 0, TAU); c.fill(); c.stroke();

    case 'slick': c.beginPath(); c.ellipse(0, -38, 41, 28, 0, PI, TAU); c.fill(); c.strokeStyle = 'rgba(255,255,255,.3)'; c.lineWidth = 3; c.beginPath(); c.arc(-6, -30, 26, PI * 1.15, PI * 1.6); c.stroke(); c.strokeStyle = INK; break;
    case 'buzz': c.globalAlpha = 0.75; c.beginPath(); c.ellipse(0, -34, 39, 24, 0, PI, TAU); c.fill(); c.globalAlpha = 1; break;
    case 'long': c.beginPath(); c.ellipse(0, -34, 44, 28, 0, PI, TAU); c.fill(); c.fillRect(-46, -36, 14, 70); c.fillRect(32, -36, 14, 70); break;
    case 'comb': c.beginPath(); c.ellipse(0, -38, 41, 26, 0, PI, TAU); c.fill(); c.beginPath(); c.ellipse(-12, -50, 26, 10, -0.2, 0, TAU); c.fill(); break;
    case 'ring': c.beginPath(); c.moveTo(-40, -2); c.quadraticCurveTo(-44, -30, -30, -34); c.lineTo(-26, -18); c.quadraticCurveTo(-32, -10, -32, 4); c.closePath(); c.fill(); c.beginPath(); c.moveTo(40, -2); c.quadraticCurveTo(44, -30, 30, -34); c.lineTo(26, -18); c.quadraticCurveTo(32, -10, 32, 4); c.closePath(); c.fill();

  else if (look.beard === 'stubble') { c.globalAlpha = 0.25; c.beginPath(); c.moveTo(-36, 0); c.quadraticCurveTo(-34, 38, 0, 40); c.quadraticCurveTo(34, 38, 36, 0); c.quadraticCurveTo(0, 20, -36, 0); c.fill(); c.globalAlpha = 1; }

  // glasses
  if (look.glasses === 'specs') { c.strokeStyle = '#222'; c.lineWidth = 3.5; c.fillStyle = 'rgba(200,230,255,.25)'; rrect(c, -31, -19, 25, 17, 4); c.fill(); c.stroke(); rrect(c, 6, -19, 25, 17, 4); c.fill(); c.stroke(); c.beginPath(); c.moveTo(-6, -12); c.lineTo(6, -12); c.moveTo(-31, -13); c.lineTo(-40, -12); c.moveTo(31, -13); c.lineTo(40, -12); c.stroke(); c.fillStyle = 'rgba(255,255,255,.5)'; c.fillRect(-27, -16, 7, 3); c.fillRect(10, -16, 7, 3); }

function drawBackdrop(c, th, camX, yOff = 0) {
  c.drawImage(th.sky, 0, 0);
  if (yOff) { c.save(); c.translate(0, yOff); }
  for (const L of th.layers) {
    const w = L.c.width, off = -((camX * L.f) % w + w) % w;
    for (let x = off; x < W; x += w) c.drawImage(L.c, Math.floor(x), 0);
  }
  if (th.haze) { c.fillStyle = th.haze; c.fillRect(0, -yOff, W, GROUND + yOff); }
  if (yOff) c.restore();
}
function drawGround(c, th, camX, camY = 0) {
  const g = th.ground, w = g.width, off = -((camX % w) + w) % w;
  for (let x = off; x < W; x += w) c.drawImage(g, Math.floor(x), GROUND - camY);
}

function trackVal(tr, t) {
  for (let i = 0; i < tr.length - 1; i++) {
    if (t <= tr[i + 1][0]) { const a = tr[i], b = tr[i + 1]; const k = ease((t - a[0]) / Math.max(1e-4, b[0] - a[0])); return [a[1], b[1], k]; }
  }
  const l = tr[tr.length - 1]; return [l[1], l[1], 1];
}

class Gun {
  constructor(key) {
    this.key = key; this.def = WEAPONS[key];

    this.slide = 0; this.pump = 0; this.cyl = 0; this.cover = 0; this.magIn = true; this.carry = null;
    this.flash = 0; this.pumpT = 0; this.fireMode = false;
  }

  reloading() { return !!this.reload; }
  canReload(owner) { const d = this.def; return !d.melee && !this.reload && this.mag < d.mag && owner.reserve(d.ammo) > 0; }
  startReload(owner) {
    if (!this.canReload(owner)) return false;
    const d = this.def;
    if (d.reloadType === 'shell') this.reload = { phase: 'start', t: 0, dur: d.reload };
    else this.reload = { phase: 'main', t: 0, dur: d.reload * (owner.reloadMul || 1), fired: {} };
    return true;
  }
  cancelReload() { if (this.reload && this.def.reloadType === 'shell') { this.reload = null; this.carry = null; this.pumpT = 0.36; return true; } return false; }
  update(dt, owner, lv) {

  c.strokeStyle = 'rgba(0,0,0,.6)'; c.lineWidth = 4;

// ---------- dialogue ----------
class Dialogue {
  constructor(lines) { this.lines = lines; this.i = 0; this.chars = 0; this.finished = false; this.t = 0; }
  get line() { return this.lines[this.i]; }
  update(dt) {
    if (this.finished) return;
    const L = this.line, full = L[1].length;
    const prev = Math.floor(this.chars);
    this.chars = Math.min(full, this.chars + dt * 52);
    if (Math.floor(this.chars) > prev && Math.floor(this.chars) % 3 === 0) Audio.play('type');
    if (Input.hit('Space') || Input.mclick || Input.hit('Enter') || Input.hit('KeyE')) {
      if (this.chars < full) this.chars = full;
      else { this.i++; this.chars = 0; Audio.play('ui', 0, 0.4); if (this.i >= this.lines.length) this.finished = true; }
    }
    if (Input.hit('Escape') && false) this.finished = true;
  }
  draw(c) {
    if (this.finished) return;
    const [who, text, expr] = this.line, look = LOOKS[who];
    const x = 90, y = 82, w = W - 180, h = 150;
    c.fillStyle = 'rgba(8,8,10,.86)'; rrect(c, x, y, w, h, 12); c.fill(); c.strokeStyle = 'rgba(255,220,140,.35)'; c.lineWidth = 2; c.stroke();
    let tx = x + 26;
    if (look) { drawPortrait(c, x + 14, y + 12, 126, look, expr || 'neutral'); tx = x + 160; }
    c.font = 'bold 18px "Oswald", Impact, sans-serif'; c.fillStyle = who === 'walter' || who === 'walterHat' ? '#9fd88a' : who === 'jace' ? '#ffb070' : '#ffd060';
    c.fillText(look ? look.name.toUpperCase() : (who === 'narrator' ? '' : who.toUpperCase()), tx, y + 34);
    c.font = '19px "Oswald", sans-serif'; c.fillStyle = '#f2ece0';
    wrapText(c, text.slice(0, Math.floor(this.chars)), tx, y + 66, w - (tx - x) - 30, 26);
    if (this.chars >= text.length) { c.fillStyle = `rgba(255,220,140,${0.5 + Math.sin(performance.now() / 200) * 0.4})`; c.font = '13px "Oswald", sans-serif'; c.textAlign = 'right'; c.fillText('SPACE ▸', x + w - 18, y + h - 14); c.textAlign = 'left'; }
  }
}
function wrapText(c, text, x, y, maxW, lh) {
  const words = text.split(' '); let line = '', yy = y;
  for (const w of words) { const test = line ? line + ' ' + w : w; if (c.measureText(test).width > maxW && line) { c.fillText(line, x, yy); line = w; yy += lh; } else line = test; }
  if (line) c.fillText(line, x, yy);
  return yy;
}

function setupHighway(lv) {

  if (lv.player) { lv.player.x = rv.x + 180; lv.player.y = roof.y; }
  lv.cam.target = rv.x + 200;
  lv.spawnVehicle = (kind, o = {}) => {
    const v = new Vehicle(kind, lv.rv.x + (o.from === 'right' ? 1300 : -900), o);
    v.offset = o.offset !== undefined ? o.offset : (kind === 'truck' ? -520 : rand(-420, -200));
    const look = o.look || 'biker';
    if (kind === 'bike') { const r = new Actor({ kind: o.rider || choose(['gunner', 'smg']), team: 'enemy', x: v.x, look, alert: true, face: 1 }); r.sit = true; r.mounted = v; v.riders.push(r); lv.actors.push(r); }
    else {
      const d = new Actor({ kind: 'gunner', team: 'enemy', x: v.x, look, alert: true, face: 1 }); d.sit = true; d.mounted = v; d.passiveShoot = true; v.riders.push(d); lv.actors.push(d);
      for (let i = 0; i < (o.gunners || 2); i++) { const g = new Actor({ kind: choose(['rifleman', 'shotgunner', 'smg']), team: 'enemy', x: v.x, look, alert: true, face: 1 }); g.mounted = v; v.riders.push(g); lv.actors.push(g); }
    }

// periodic-table style logo: [Fi]xing [Go]od
function drawElementTile(c, x, y, s, sym, num, mass) {
  const g = c.createLinearGradient(x, y, x + s, y + s); g.addColorStop(0, '#2f7a2a'); g.addColorStop(1, '#174a14');
  c.fillStyle = g; c.fillRect(x, y, s, s); c.strokeStyle = '#d8f0c8'; c.lineWidth = Math.max(2, s / 40); c.strokeRect(x, y, s, s);
  c.fillStyle = '#e8f8e0'; c.font = `bold ${s * 0.18}px ${FONT}`; c.textAlign = 'left'; c.fillText(num, x + s * 0.08, y + s * 0.22);
  c.font = `${s * 0.12}px ${FONT}`; c.textAlign = 'right'; c.fillText(mass, x + s * 0.92, y + s * 0.92);
  c.font = `bold ${s * 0.62}px ${FONT}`; c.textAlign = 'center'; c.fillStyle = '#fff'; c.fillText(sym, x + s * 0.5, y + s * 0.78); c.textAlign = 'left';
}

// ---------------------------------------------------------------- STORY CONTROLLER
const Story = {
  play(ch) {
    const C = CHAPTERS[ch]; if (!C) { Game.setScene(new EndingScene()); return; }
    this.ch = ch; this.seq = C.seq; this.i = -1; this.next();
  },
  next() {
    this.i++;
    if (this.i >= this.seq.length) return this.finish();
    const it = this.seq[this.i]; if (it.onStart) it.onStart(Game.state);
    if (it.level) Game.setScene(new LevelScene(it.level, () => this.next()));
    else if (it.cook) Game.setScene(new CookScene({ tutorial: true, done: () => this.next() }));
    else if (it.ending) { Game.state.chapter = CHAPTERS.length; Game.state.flags.finished = true; Game.save(); Game.setScene(new EndingScene()); }
  },
  finish() { Game.state.chapter = this.ch + 1; Game.save(); Game.setScene(new HubScene({ message: CHAPTERS[this.ch].after, title: 'CHAPTER COMPLETE: ' + CHAPTERS[this.ch].title.toUpperCase() })); },
};

class LevelScene {
  constructor(key, onDone, opts = {}) {
    this.key = key; this.def = opts.def || LEVELS[key]; this.onDone = onDone; this.opts = opts;
    this.snapshot = JSON.stringify(Game.state); this.paused = false; this.overlay = null; this.resultsT = 0; this.results = null;
    this.makeLevel(null);
  }
  makeLevel(cp) {
    const lv = new Level(this.def, { checkpoint: cp }); if (this.def.mode === 'highway') setupHighway(lv);
    this.lv = lv; Game.level = lv; Audio.music(this.def.music || 'action');
  }
  enter() { }
  update(dt) {
    const lv = this.lv;
    if (this.results) { this.resultsT += dt; return; }
    if (Input.hit('Escape') || Input.hit('KeyP')) { if (this.overlay) this.overlay = null; else this.paused = !this.paused; Audio.play('ui'); }
    if (this.paused) return;
    lv.update(dt);
    if (lv.checkpoint && lv.checkpoint !== this._cp) { this._cp = lv.checkpoint; Game.saveMags(lv); this.cpSnap = JSON.stringify(Game.state); }
    if (lv.done && lv.fade >= 0.98 || lv.done && lv.fadeTarget === 0 && lv.stepI >= lv.steps.length) this.complete();
  }
  complete() {
    const lv = this.lv; Game.saveMags(lv);
    if (lv.player) Game.state.armor = lv.player.armor;
    const combat = lv.stats.kills > 0 && !this.opts.noResults;
    if (combat) { this.results = { kills: lv.stats.kills, heads: lv.stats.heads, cash: lv.stats.cash, time: lv.stats.time }; this.resultsT = 0; }
    else { Game.save(); this.onDone(); }
  }
  retry(fromCp) {
    const snap = fromCp && this.cpSnap ? this.cpSnap : this.snapshot;
    Game.state = Object.assign(Game.newState(), JSON.parse(snap));
    this.makeLevel(fromCp ? this.lv.checkpoint : null); this.paused = false;
  }
  draw(c) {
    const lv = this.lv; lv.draw(c);
    if (lv.failed && lv.failT > 1.2) {
      c.fillStyle = `rgba(40,0,0,${Math.min(0.75, (lv.failT - 1.2) * 0.8)})`; c.fillRect(0, 0, W, H);
      UI.text(c, 'GAME OVER', W / 2, 270, 72, '#ff4a3a', 'center', true);
      UI.text(c, lv.failReason || choose0(['"Jace... we were so close." — Walter', '"Get up, Jace. Get UP." — Walter'], lv), W / 2, 320, 20, '#f0d0c0', 'center');
      if (lv.checkpoint && UI.btn(c, W / 2 - 160, 370, 320, 52, 'RETRY FROM CHECKPOINT')) this.retry(true);
      if (UI.btn(c, W / 2 - 160, 432, 320, 52, 'RESTART MISSION')) this.retry(false);
      if (UI.btn(c, W / 2 - 160, 494, 320, 52, 'QUIT TO MENU')) { Game.state = Object.assign(Game.newState(), JSON.parse(this.snapshot)); Game.save(); Game.setScene(new MenuScene()); }
      UI.cursor(c); return;
    }
    if (this.results) return this.drawResults(c);
    if (this.paused) {
      c.fillStyle = 'rgba(0,0,0,.6)'; c.fillRect(0, 0, W, H);
      if (this.overlay === 'settings') { drawSettings(c, () => this.overlay = null); UI.cursor(c); return; }
      if (this.overlay === 'controls') { drawControls(c, () => this.overlay = null); UI.cursor(c); return; }
      UI.text(c, 'PAUSED', W / 2, 200, 56, '#fff', 'center', true);
      let y = 250;
      if (UI.btn(c, W / 2 - 150, y, 300, 50, 'RESUME')) this.paused = false; y += 60;
      if (lv.checkpoint && UI.btn(c, W / 2 - 150, y, 300, 50, 'RETRY CHECKPOINT')) this.retry(true); if (lv.checkpoint) y += 60;
      if (UI.btn(c, W / 2 - 150, y, 300, 50, 'RESTART MISSION')) this.retry(false); y += 60;
      if (UI.btn(c, W / 2 - 150, y, 300, 50, 'CONTROLS')) this.overlay = 'controls'; y += 60;
      if (UI.btn(c, W / 2 - 150, y, 300, 50, 'SETTINGS')) this.overlay = 'settings'; y += 60;
      if (UI.btn(c, W / 2 - 150, y, 300, 50, Game.state.chapter > 0 ? 'ABANDON (BACK TO MAP)' : 'QUIT TO MENU')) { Game.state = Object.assign(Game.newState(), JSON.parse(this.snapshot)); Game.save(); Game.setScene(Game.state.chapter > 0 ? new HubScene() : new MenuScene()); }

  drawResults(c) {

    rows.forEach(([k, v], i) => { if (t < 0.4 + i * 0.25) return; UI.text(c, k, W / 2 - 180, 280 + i * 40, 22, '#ccc'); UI.text(c, String(v), W / 2 + 180, 280 + i * 40, 22, '#fff', 'right', true); });
    if (t > 1.8 && (UI.btn(c, W / 2 - 120, 510, 240, 54, 'CONTINUE') || Input.hit('Space') || Input.hit('Enter'))) { this.results = null; Game.save(); this.onDone(); }

'use strict';
// ============================================================

NODES.bar = { x: 880, y: 220, name: 'The Dog House', sub: 'Side jobs · bounties · turf wars', icon: 'job' };
ROADS.push(['morty', 'bar'], ['bar', 'junk']);

const JOB_PLACES = [
  { name: 'the old drive-in', theme: 'dusk', look: 'thug' }, { name: 'Sandoval\'s scrapyard', theme: 'junkyard', look: 'thug' },
  { name: 'a trailer park', theme: 'night', look: 'biker' }, { name: 'the Route 9 truck stop', theme: 'motel', look: 'biker' },
  { name: 'a cartel stash house', theme: 'ranch', look: 'cartel' }, { name: 'a storage depot', theme: 'warehouse', look: 'guard' },
  { name: 'a chop shop', theme: 'compound', look: 'biker' }, { name: 'the dry riverbed', theme: 'day', look: 'thug' },
];
const BOUNTY_NAMES = ['"Two-Teeth" Toby', 'Big Lupe', 'The Accountant', 'Junior Skaggs', 'Mad Dog Morales', 'Crazy Earl', 'Little Hector', 'Smiley Ruiz'];
function makeJobs() {
  const st = Game.state, r = srand(st.day * 977 + st.chapter * 31 + 7), out = [];
  const names = BOUNTY_NAMES.slice().sort(() => r() - 0.5), places = JOB_PLACES.slice().sort(() => r() - 0.5);
  for (let i = 0; i < 3; i++) {
    const place = places[i], diff = 1 + Math.floor(r() * 3), bounty = r() < 0.5;
    const target = names[i];
    out.push({
      seed: Math.floor(r() * 1e9), place, diff, bounty, target, walter: r() < 0.5,
      title: bounty ? 'Bounty: ' + target : 'Turf war at ' + place.name,
      desc: bounty ? `${target} owes Dusty money and is hiding out at ${place.name}. Bring Dusty his... apology.` : `A crew is moving cheap cut product out of ${place.name}. Shut them down.`,
      reward: 600 + diff * 450 + st.chapter * 300, done: false,
    });
  }
  return out;
}
function makeJobLevel(job) {
  const r = srand(job.seed), ch = Game.state.chapter, width = 3800 + Math.floor(r() * 1400);
  const pool = ['thug', 'gunner', 'gunner', 'smg'].concat(ch >= 2 ? ['shotgunner', 'knifer'] : [], ch >= 3 ? ['rifleman', 'rifleman'] : [], ch >= 5 ? ['heavy'] : []);
  const pick = () => pool[Math.floor(r() * pool.length)];
  const night = ['night', 'motel', 'warehouse'].includes(job.place.theme);
  const steps = [{ cine: true, title: job.title.toUpperCase(), sub: 'SIDE JOB' }, { wait: 1.6 }, { cine: false, objective: job.bounty ? 'Find ' + job.target : 'Clear out the crew' }];
  const waves = 2 + job.diff;
  for (let w = 0; w < waves; w++) {
    const x = 500 + (w + 0.5) * (width - 900) / waves;
    steps.push({ reach: x - 500 });
    const n = 2 + job.diff + Math.floor(ch / 3) + (r() < 0.5 ? 1 : 0), spawn = [];
    for (let k = 0; k < n; k++) spawn.push(k === n - 1 && r() < 0.4 ? { t: pick(), from: 'left' } : { t: pick(), x: x + 100 + r() * 400 });
    steps.push({ spawn }, { clear: true }, { cp: true });
  }
  if (job.bounty) {
    const kind = ch >= 4 ? 'heavy' : 'dimitri';
    steps.push({ reach: width - 900 }, { spawn: [{ t: kind, id: 'target', x: width - 300, name: job.target, hp: 300 + ch * 60 + job.diff * 60, boss: true }, { t: pick(), x: width - 400 }, { t: pick(), from: 'left' }], boss: 'target', objective: 'Take down ' + job.target, banter: [null, job.target + ': "Dusty sent YOU?"'] });
    steps.push({ until: lv => !lv.named.target.alive }, { boss: null }, { clear: true });
  }
  steps.push({ objective: '', do: lv => { Game.state.money += job.reward; const jj = (Game.state.jobs || []).find(x => x.seed === job.seed); if (jj) jj.done = true; lv.toast('JOB DONE  +' + fmtMoney(job.reward)); } }, { wait: 1.8 }, { fade: 'out' }, { end: true });
  return {
    theme: job.place.theme, width, start: 180, walter: job.walter, music: 'action', enemyLook: job.place.look, dark: night ? 0.6 : undefined,
    build(L) {
      let x = 560;
      while (x < width - 260) {
        const k = r();
        if (k < 0.22) L.crate(x, 64, 56 + Math.floor(r() * 3) * 6, ['wood', 'metal', 'cardboard', 'sandbag'][Math.floor(r() * 4)]);
        else if (k < 0.36) { L.car(x, ['#7a2a2a', '#2a3a5a', '#4a4a3a', '#5a3a6a', '#c8c0a0'][Math.floor(r() * 5)], r() < 0.4 ? 'pickup' : 'sedan', r() < 0.5 ? 1 : -1); x += 200; }
        else if (k < 0.52) L.barrel(x, r() < 0.7 ? 'red' : 'propane');
        else if (k < 0.68) L.plat(x, GROUND - 125 - Math.floor(r() * 3) * 10, 200 + Math.floor(r() * 80));
        else if (k < 0.8) L.stack(x, r() < 0.5 ? 'wood' : 'metal');
        else if (!night) L.cactus(x, 80 + r() * 60);
        if (night && r() < 0.5) L.lamp(x + 60, 250);
        x += 230 + r() * 260;
      }
    },
    steps,
  };
}
class JobScene {

      UI.text(c, (j.walter ? 'Walter comes along' : 'Solo job') + '  ·  Location: ' + j.place.name, x + 24, y + 150, 14, '#a89a80');

      else if (UI.btn(c, x + 650, y + 124, 186, 46, 'TAKE THE JOB')) Game.setScene(new LevelScene(null, () => Game.setScene(new JobScene()), { def: makeJobLevel(j) }));
    });
    if (UI.btn(c, 40, H - 90, 200, 50, 'LEAVE')) Game.setScene(new HubScene());

'use strict';
// ============================================================
//  FIXING GOOD - game state + main loop
// ============================================================
const Game = {
  scene: null, level: null, state: null, time: 0, cheatGod: false,
  newState() {
    return {
      chapter: 0, money: 400, bags: 0, purity: 0, precursor: 4, heat: 0, day: 1,
      ammo: { '9mm': 75, '357': 0, '12ga': 0, '762': 0 }, weapons: ['pistol'], mags: {}, lastGun: 'pistol',
      armor: 0, medkits: 1, bangs: 0, molotovs: 0, walterBangs: false, upgrades: {}, flags: {},
      stats: { kills: 0, heads: 0, shots: 0, earned: 0, cooks: 0, bagsSold: 0, bestPurity: 0 },
      difficulty: 'normal', unlocked: ['rv'], buyers: null, playTime: 0,
    };
  },
  diffMul() { return { easy: 0.6, normal: 1, hard: 1.45 }[this.state.difficulty] || 1; },
  hasSave() { return !!load('save'); },
  save() { if (this.state) { store('save', this.state); } },
  loadSave() { const s = load('save'); if (s) { this.state = Object.assign(this.newState(), s); this.state.upgrades = s.upgrades || {}; return true; } return false; },
  saveMags(lv) { const p = lv.player; if (!p) return; for (const g of p.guns) this.state.mags[g.key] = g.mag; if (p.gun) this.state.lastGun = p.gun.key; },
  setScene(s) { if (this.scene && this.scene.exit) this.scene.exit(); this.scene = s; if (s.enter) s.enter(); },
};

// dev hooks: ?level=junkyard · ?scene=hub|cook|dusty|trade|camp|ending · &god · &ch=3
const DEV = new URLSearchParams(location.search);
const SPEED = Math.max(1, Math.min(8, +(DEV.get('speed') || 1)));
function devStart() {
  const st = Game.state = Game.newState();
  st.chapter = +(DEV.get('ch') || 3); st.money = 20000; st.bags = 12; st.purity = 93.4;
  st.weapons = ['pistol', 'revolver', 'shotgun', 'smg', 'rifle']; st.ammo = { '9mm': 400, '357': 60, '12ga': 80, '762': 400 };
  st.bangs = 3; st.molotovs = 3; st.medkits = 3; st.armor = 150; st.walterBangs = true;
  if (DEV.has('god')) Game.cheatGod = true;
  const lv = DEV.get('level'), sc = DEV.get('scene');
  if (lv) return Game.setScene(new LevelScene(lv, () => Game.setScene(new HubScene())));
  const map = { hub: () => new HubScene(), cook: () => new CookScene({ done: () => Game.setScene(new HubScene()) }), dusty: () => new ShopScene('dusty'), hardware: () => new ShopScene('hardware'), morty: () => new ShopScene('morty'), trade: () => new TradeScene(), camp: () => new CampScene(), jobs: () => new JobScene(), ending: () => new EndingScene(), menu: () => new MenuScene() };
  if (sc && map[sc]) Game.setScene(map[sc]());
}
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 1 / 20) dt = 1 / 20;
  Game.time += dt; if (Game.state) Game.state.playTime += dt;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  try {
    if (Game.scene) { for (let i = 0; i < SPEED; i++) Game.scene.update(dt); Game.scene.draw(ctx); }
  } catch (e) { console.error(e); ctx.fillStyle = '#300'; ctx.fillRect(0, 0, W, 40); ctx.fillStyle = '#fff'; ctx.font = '14px monospace'; ctx.fillText('Error: ' + e.message, 10, 25); }
  Input.endFrame();
  requestAnimationFrame(frame);
}
Game.setScene(new LoadingScene());
requestAnimationFrame(frame);
